<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>#waitforit</title>
  <link rel="icon" href="./ico.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="map" aria-hidden="true"></div>
  <div class="map-wash" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="app-header">
      <button class="icon-button profile-button" type="button" aria-label="Profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c.5-4.1 2.7-6.3 6.5-6.3s6 2.2 6.5 6.3"/></svg>
      </button>
      <div class="wordmark" aria-label="Discover">
        <svg viewBox="0 0 35 41" aria-hidden="true"><defs><linearGradient id="flame" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#fd267a"/><stop offset="1" stop-color="#ff6036"/></linearGradient></defs><path fill="url(#flame)" d="M10.5 16.25c-.06 0-.1 0-.14-.04-1.36-1.8-1.7-4.9-1.78-6.08-.02-.23-.28-.35-.48-.24C3.9 12.24 0 17.82 0 23.2c0 9.27 6.43 17.04 17.5 17.04 10.37 0 17.5-8 17.5-17.03C35 11.4 26.57 3.58 19.06.04c-.2-.1-.42.07-.4.28.98 6.37-.36 13.28-8.17 15.95z"/></svg>
      </div>
      <button class="icon-button shield-button" type="button" aria-label="Safety center">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 6v5.2c0 4.4-2.6 7.8-7 9.8-4.4-2-7-5.4-7-9.8V6l7-3Z"/><path d="m9.2 12 1.8 1.8 4-4"/></svg>
      </button>
    </header>

    <main class="search-state">
      <div class="radar" aria-hidden="true">
        <span class="ring ring-one"></span><span class="ring ring-two"></span><span class="ring ring-three"></span>
        <span class="almost-line line-one"></span><span class="almost-line line-two"></span><span class="almost-line line-three"></span>
        <span class="nearby-person person-one"></span><span class="nearby-person person-two"></span><span class="nearby-person person-three"></span><span class="nearby-person person-four"></span>
        <div class="flame-button">
          <span class="flame-glow glow-one"></span><span class="flame-glow glow-two"></span><span class="flame-glow glow-three"></span>
          <svg viewBox="0 0 35 41"><path d="M10.5 16.25c-.06 0-.1 0-.14-.04-1.36-1.8-1.7-4.9-1.78-6.08-.02-.23-.28-.35-.48-.24C3.9 12.24 0 17.82 0 23.2c0 9.27 6.43 17.04 17.5 17.04 10.37 0 17.5-8 17.5-17.03C35 11.4 26.57 3.58 19.06.04c-.2-.1-.42.07-.4.28.98 6.37-.36 13.28-8.17 15.95z"/></svg>
        </div>
      </div>

      <section class="status-card" aria-live="polite">
        <p class="eyebrow"><span></span> Discovering nearby</p>
        <h1>Finding people for you</h1>
        <p class="status-copy" id="statusCopy">Looking just beyond your current distance settings…</p>
        <div class="connection-count">
          <span><strong id="nearbyCount">2,481</strong> people nearby</span>
          <i></i>
          <span><strong>0</strong> connections held</span>
        </div>
        <div class="progress" aria-hidden="true"><span></span></div>
        <button class="matches-button" id="matchesButton" type="button">Keep looking</button>
      </section>
    </main>

    <nav class="app-nav" aria-label="Primary">
      <button class="nav-item active" type="button" aria-label="Discover"><svg viewBox="0 0 35 41" aria-hidden="true"><path d="M10.5 16.25c-.06 0-.1 0-.14-.04-1.36-1.8-1.7-4.9-1.78-6.08-.02-.23-.28-.35-.48-.24C3.9 12.24 0 17.82 0 23.2c0 9.27 6.43 17.04 17.5 17.04 10.37 0 17.5-8 17.5-17.03C35 11.4 26.57 3.58 19.06.04c-.2-.1-.42.07-.4.28.98 6.37-.36 13.28-8.17 15.95z"/></svg></button>
      <button class="nav-item" type="button" aria-label="Explore"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 14.6 9l6.6.6-5 4.3 1.5 6.4-5.7-3.4-5.7 3.4 1.5-6.4-5-4.3L9.4 9 12 2.8Z"/></svg></button>
      <button class="nav-item" type="button" aria-label="Likes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 9.2c0 5.2-8.5 10-8.5 10s-8.5-4.8-8.5-10A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.5 2.8Z"/></svg></button>
      <button class="nav-item" type="button" aria-label="Messages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H9l-5 3v-14Z"/></svg></button>
    </nav>
  </div>

  <script>
    const destinations = Array.from({ length: 20 }, (_, index) => `../loader${index + 2 > 21 ? 1 : index + 2}/index.html`)
      .filter(path => path !== '../loader1/index.html');
    const statusCopy = document.getElementById('statusCopy');
    const matchesButton = document.getElementById('matchesButton');
    const messages = [
      'Looking just beyond your current distance settings…',
      'A lot of people are close. Keep looking…',
      'Searching for a signal that lasts…',
      'Your next connection could be a little farther away…'
    ];
    let messageIndex = 0;

    window.setInterval(() => {
      statusCopy.classList.add('changing');
      window.setTimeout(() => {
        messageIndex = (messageIndex + 1) % messages.length;
        statusCopy.textContent = messages[messageIndex];
        statusCopy.classList.remove('changing');
      }, 220);
    }, 3600);

    matchesButton.addEventListener('click', () => {
      const destination = destinations[Math.floor(Math.random() * destinations.length)];
      window.location.href = destination;
    });
  </script>
</body>
</html>
